name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
  # schedule: [{ cron: '0 * * * *' }]   # optional hourly URL re-check (see refresh-jobs.md)
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5 # version comes from packageManager in package.json
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec ng build --base-href /nw-frontend-jobs/
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist/jobs-site/browser }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v5
