<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Frontend Developer roles – North West England plus remote UK</title>
  <meta name="description" content="Frontend developer job postings in North West England, plus fully remote roles open to UK residents, with work mode, contract type and security clearance.">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before first paint so dark mode doesn't flash light. ThemeService takes over once Angular starts.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
